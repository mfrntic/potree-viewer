<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDL Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #test-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 1000;
      max-width: 300px;
    }

    #test-panel button {
      margin: 5px 0;
      padding: 8px 12px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }

    #test-panel button:hover {
      background: #2980b9;
    }

    #test-panel input[type="range"] {
      width: 100%;
      margin: 5px 0;
    }

    .test-section {
      margin: 15px 0;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .test-section h3 {
      margin-bottom: 10px;
      color: #3498db;
    }

    #log {
      margin-top: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 10px;
    }

    .log-entry {
      margin: 2px 0;
    }

    .log-info { color: #3498db; }
    .log-success { color: #2ecc71; }
    .log-error { color: #e74c3c; }
  </style>
</head>

<body>
  <div id="container"></div>
  
  <div id="test-panel">
    <h2>🧪 EDL Test Panel</h2>
    
    <div class="test-section">
      <h3>1. Toggle EDL</h3>
      <button id="btn-toggle">Toggle EDL</button>
      <button id="btn-enable">Enable EDL</button>
      <button id="btn-disable">Disable EDL</button>
      <div style="margin-top: 10px;">
        <strong>Status:</strong> <span id="edl-status">Disabled</span>
      </div>
    </div>

    <div class="test-section">
      <h3>2. Adjust Parameters</h3>
      <label>Strength: <span id="strength-value">0.4</span></label>
      <input type="range" id="strength-slider" min="0" max="2" step="0.1" value="0.4">
      
      <label>Radius: <span id="radius-value">1.4</span></label>
      <input type="range" id="radius-slider" min="0.5" max="3" step="0.1" value="1.4">
      
      <label>Opacity: <span id="opacity-value">1.0</span></label>
      <input type="range" id="opacity-slider" min="0" max="1" step="0.05" value="1">
    </div>

    <div class="test-section">
      <h3>3. Test Sequence</h3>
      <button id="btn-test">Run Full Test</button>
      <button id="btn-debug-state">🔍 Debug EDL State</button>
    </div>

    <div id="log"></div>
  </div>

  <script type="module">
    import { PotreeViewer, Toolbar, PointColorType } from './src/index.js';

    const baseUrl = "public/spruce";
    let viewer = null;

    // Logging function
    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(message);
    }

    // Update status display
    function updateStatus() {
      const status = document.getElementById('edl-status');
      const isEnabled = viewer.isEDLEnabled();
      status.textContent = isEnabled ? '✅ Enabled' : '❌ Disabled';
      status.style.color = isEnabled ? '#2ecc71' : '#e74c3c';
      
      const settings = viewer.getEDLSettings();
      log(`EDL Status: ${isEnabled ? 'ON' : 'OFF'}, Strength: ${settings.strength}, Radius: ${settings.radius}, Opacity: ${settings.opacity}`, 'info');
    }

    // Initialize viewer
    async function initViewer() {
      log('Initializing viewer...', 'info');
      
      viewer = new PotreeViewer({
        container: document.getElementById('container'),
        pointCloudUrl: `${baseUrl}/metadata.json`,
        pointCloudName: 'EDL Test',
        fov: 80,
        initialView: 'front',
        material: {
          size: 0.8,
          minSize: 0.4,
          pointSizeType: 'FIXED',
          shape: 'SQUARE',
        },
        background: 'white',
        autoFitOnLoad: true,
        edl: {
          enabled: false,
          strength: 0.4,
          radius: 1.4,
          opacity: 1.0
        },
        onPointCloudLoaded: () => {
          log('✅ Point cloud loaded', 'success');
          viewer.setPointColorType(PointColorType.RGB);
          updateStatus();
        }
      });

      // Create toolbar
      const toolbar = new Toolbar(viewer, {
        alignment: 'top-right'
      });

      window.viewer = viewer;
      window.toolbar = toolbar;
      
      // Expose debug helpers
      window.checkEDL = () => {
        const config = viewer.getEDLSettings();
        const internal = viewer.getEDLInternalState();
        console.log('Config:', config);
        console.log('Internal:', internal);
        console.log('PotreeRenderer:', viewer.potreeRenderer);
        return { config, internal };
      };
      
      window.testStrength = (value) => {
        console.log(`Testing strength = ${value}`);
        viewer.setEDLStrength(value);
        setTimeout(() => {
          const state = viewer.getEDLInternalState();
          console.log('Internal strength after change:', state.strength);
        }, 100);
      };

      log('✅ Viewer initialized', 'success');
      log('💡 You can also use window.checkEDL() in console', 'info');
    }

    // Wait for viewer to initialize
    await initViewer();

    // Event listeners for buttons
    document.getElementById('btn-toggle').onclick = () => {
      viewer.toggleEDL();
      log('🔄 Toggled EDL', 'info');
      updateStatus();
    };

    document.getElementById('btn-enable').onclick = () => {
      viewer.enableEDL();
      log('✅ Enabled EDL', 'success');
      updateStatus();
    };

    document.getElementById('btn-disable').onclick = () => {
      viewer.disableEDL();
      log('❌ Disabled EDL', 'info');
      updateStatus();
    };

    // Sliders
    document.getElementById('strength-slider').oninput = (e) => {
      const value = parseFloat(e.target.value);
      document.getElementById('strength-value').textContent = value.toFixed(1);
      viewer.setEDLStrength(value);
      log(`🎚️ Strength changed to ${value}`, 'info');
      
      // Immediately check internal state
      setTimeout(() => {
        const internalState = viewer.getEDLInternalState();
        log(`   Internal strength: ${internalState.strength}`, 'info');
      }, 100);
    };

    document.getElementById('radius-slider').oninput = (e) => {
      const value = parseFloat(e.target.value);
      document.getElementById('radius-value').textContent = value.toFixed(1);
      viewer.setEDLRadius(value);
      log(`🎚️ Radius changed to ${value}`, 'info');
      
      // Immediately check internal state
      setTimeout(() => {
        const internalState = viewer.getEDLInternalState();
        log(`   Internal radius: ${internalState.radius}`, 'info');
      }, 100);
    };

    document.getElementById('opacity-slider').oninput = (e) => {
      const value = parseFloat(e.target.value);
      document.getElementById('opacity-value').textContent = value.toFixed(2);
      viewer.setEDLOpacity(value);
      log(`🎚️ Opacity changed to ${value}`, 'info');
      
      // Immediately check internal state
      setTimeout(() => {
        const internalState = viewer.getEDLInternalState();
        log(`   Internal opacity: ${internalState.opacity}`, 'info');
      }, 100);
    };

    // Debug state button
    document.getElementById('btn-debug-state').onclick = () => {
      log('🔍 Checking EDL internal state...', 'info');
      const config = viewer.getEDLSettings();
      const internal = viewer.getEDLInternalState();
      
      log(`Config - enabled: ${config.enabled}, strength: ${config.strength}, radius: ${config.radius}, opacity: ${config.opacity}`, 'info');
      log(`Internal - strength: ${internal.strength}, radius: ${internal.radius}, opacity: ${internal.opacity}`, 'info');
      
      if (config.strength !== internal.strength) {
        log(`⚠️ MISMATCH: strength config=${config.strength} but internal=${internal.strength}`, 'error');
      }
      if (config.radius !== internal.radius) {
        log(`⚠️ MISMATCH: radius config=${config.radius} but internal=${internal.radius}`, 'error');
      }
      if (config.opacity !== internal.opacity) {
        log(`⚠️ MISMATCH: opacity config=${config.opacity} but internal=${internal.opacity}`, 'error');
      }
    };

    // Full test sequence
    document.getElementById('btn-test').onclick = async () => {
      log('🧪 Starting full test sequence...', 'info');
      
      // Test 1: Change parameters while disabled
      log('Test 1: Changing parameters while EDL is disabled...', 'info');
      viewer.setEDLStrength(1.5);
      document.getElementById('strength-slider').value = 1.5;
      document.getElementById('strength-value').textContent = '1.5';
      
      viewer.setEDLRadius(2.0);
      document.getElementById('radius-slider').value = 2.0;
      document.getElementById('radius-value').textContent = '2.0';
      
      viewer.setEDLOpacity(0.8);
      document.getElementById('opacity-slider').value = 0.8;
      document.getElementById('opacity-value').textContent = '0.80';
      
      await new Promise(resolve => setTimeout(resolve, 1000));
      
      // Test 2: Enable EDL (should use new parameters)
      log('Test 2: Enabling EDL (should use new parameters)...', 'success');
      viewer.enableEDL();
      updateStatus();
      
      const settings1 = viewer.getEDLSettings();
      if (settings1.strength === 1.5 && settings1.radius === 2.0 && settings1.opacity === 0.8) {
        log('✅ Parameters applied correctly!', 'success');
      } else {
        log('❌ Parameters NOT applied correctly!', 'error');
        log(`Expected: strength=1.5, radius=2.0, opacity=0.8`, 'error');
        log(`Got: strength=${settings1.strength}, radius=${settings1.radius}, opacity=${settings1.opacity}`, 'error');
      }
      
      await new Promise(resolve => setTimeout(resolve, 2000));
      
      // Test 3: Change parameters while enabled
      log('Test 3: Changing parameters while EDL is enabled...', 'info');
      viewer.setEDLStrength(0.8);
      document.getElementById('strength-slider').value = 0.8;
      document.getElementById('strength-value').textContent = '0.8';
      
      await new Promise(resolve => setTimeout(resolve, 1000));
      
      const settings2 = viewer.getEDLSettings();
      if (settings2.strength === 0.8) {
        log('✅ Live parameter update works!', 'success');
      } else {
        log('❌ Live parameter update failed!', 'error');
      }
      
      // Test 4: Disable and re-enable
      log('Test 4: Disabling and re-enabling...', 'info');
      viewer.disableEDL();
      updateStatus();
      
      await new Promise(resolve => setTimeout(resolve, 1000));
      
      viewer.enableEDL();
      updateStatus();
      
      const settings3 = viewer.getEDLSettings();
      if (settings3.strength === 0.8) {
        log('✅ Parameters preserved after toggle!', 'success');
      } else {
        log('❌ Parameters NOT preserved!', 'error');
      }
      
      log('🏁 Test sequence completed!', 'success');
    };
  </script>
</body>
</html>
