<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PotreeViewer Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script type="module">
    import { PotreeViewer, Toolbar, PotreeViewerConsole, PointColorType } from './src/index.js';

    // Base URL for the point cloud data
    const baseUrl = 'https://potreestorage.blob.core.windows.net/converted/742ff0a5-e5c9-44a5-8348-fc4fba7f4f4a';

    // Load project metadata and initialize viewer
    async function initViewer() {
      let projectName = 'Point Cloud';
      let description = 'Point Cloud Data';

      try {
        const response = await fetch(`${baseUrl}/project-metadata.json`);
        const metadata = await response.json();
        console.log('Project Metadata:', metadata);
        
        // Extract name and description from metadata
        projectName = metadata.name || metadata.projectName || projectName;
        description = metadata.description || `${projectName} Point Cloud`;
      } catch (error) {
        console.warn('Could not load project metadata, using defaults:', error);
      }

      // Create viewer with metadata
      const viewer = new PotreeViewer({
        container: document.getElementById('container'),
        pointCloudUrl: `${baseUrl}/metadata.json`,
        pointCloudName: projectName,
        description: description,
        pointBudget: 1_000_000,
        fov: 80,
        initialView: 'front',
        material: {
          size: 0.8,
          minSize: 0.4,
          pointSizeType: 'FIXED',
          shape: 'SQUARE',
        },
        background: 'white',
        autoFitOnLoad: true,

        onReady: (viewerInstance) => {
          console.log('Viewer ready!', viewerInstance);
        },

        onPointCloudLoaded: (pointCloud) => {
          console.log('Point cloud loaded:', pointCloud);
          viewer.setPointColorType(PointColorType.RGB);
        },

        onError: (error) => {
          console.error('Viewer error:', error);
        }
      });

      return viewer;
    }

    // Initialize and expose to window
    const viewer = await initViewer();

    // Create toolbar with default SVG icons
    const toolbar = new Toolbar(viewer, {
      alignment: 'top-right'
    });

    // Create PotreeViewerConsole (mini console)
    const viewerConsole = new PotreeViewerConsole(viewer, {
      position: 'bottom-left',
      width: '360px',
      collapsed: false,
      showTimestamp: true,
      logLevel: 'info',
      visible: true  // Set to false to hide initially
    });

    // Example: Toggle console visibility with keyboard shortcut (Ctrl+`)
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === '`') {
        viewerConsole.toggleVisibility();
      }
    });

    // Expose to window for debugging
    window.viewer = viewer;
    window.toolbar = toolbar;
    window.viewerConsole = viewerConsole;
 
    // Clean up on page unload
    window.addEventListener('beforeunload', () => {
      toolbar.dispose();
      viewerConsole.dispose();
      viewer.dispose();
    });
  </script>
</body>
</html>
