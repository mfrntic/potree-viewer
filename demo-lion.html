<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PotreeViewer Demo - Lion Takanawa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script type="module">
    import { PotreeViewer, Toolbar, PotreeViewerConsole } from './src/index.js';

    // Create viewer
    const viewer = new PotreeViewer({
      container: document.getElementById('container'),
      pointCloudUrl: '/7_1/metadata.json',
      pointCloudName: '7_1 Test',
      description: 'Test with 7_1 point cloud',
      language: 'en',
      pointBudget: 1_000_000,
      fov: 80,
      initialView: 'front',
      material: {
        size: 0.6,
        minSize: 0.4,
        pointSizeType: 'FIXED',
        shape: 'SQUARE',
      },
      background: 'black',
      autoFitOnLoad: true,

      // Callbacks
      onReady: (viewerInstance) => {
        console.log('Viewer ready!', viewerInstance);
      },

      onPointCloudLoaded: (pointCloud) => {
        console.log('Point cloud loaded:', pointCloud);
      },

      onError: (error) => {
        console.error('Viewer error:', error);
      }
    });

    // Create toolbar with default SVG icons
    const toolbar = new Toolbar(viewer, {
      alignment: 'top-right'
    });

    // Create PotreeViewerConsole (mini console)
    const viewerConsole = new PotreeViewerConsole(viewer, {
      position: 'bottom-left',
      width: '360px',
      collapsed: false,
      showTimestamp: true,
      visible: true
    });

    // Example: Toggle console visibility with keyboard shortcut (Ctrl+`)
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === '`') {
        viewerConsole.toggleVisibility();
      }
    });

    // Expose to window for debugging
    window.viewer = viewer;
    window.toolbar = toolbar;
    window.viewerConsole = viewerConsole;

    // Clean up on page unload
    window.addEventListener('beforeunload', () => {
      toolbar.dispose();
      viewerConsole.dispose();
      viewer.dispose();
    });
  </script>
</body>
</html>
